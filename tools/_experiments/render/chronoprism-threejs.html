<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crystallized Time // Modern Tactical Radar</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #03070d;
      font-family: 'Courier New', Courier, monospace;
      color: #00f0ff;
    }
    #webgl-container {
      position: absolute;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      z-index: 1;
    }

    /* Screen Edge Flourishes & Tactical HUD */
    .screen-edges {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 10;
    }

    .corner {
      position: absolute;
      width: 44px;
      height: 44px;
      border: 2px solid rgba(0, 240, 255, 0.45);
    }
    .corner-tl { top: 20px; left: 20px; border-right: none; border-bottom: none; }
    .corner-tr { top: 20px; right: 20px; border-left: none; border-bottom: none; }
    .corner-bl { bottom: 20px; left: 20px; border-right: none; border-top: none; }
    .corner-br { bottom: 20px; right: 20px; border-left: none; border-top: none; }

    .corner::after {
      content: '';
      position: absolute;
      width: 6px;
      height: 6px;
      background: #ff0077;
    }
    .corner-tl::after { top: -3px; left: -3px; }
    .corner-tr::after { top: -3px; right: -3px; }
    .corner-bl::after { bottom: -3px; left: -3px; }
    .corner-br::after { bottom: -3px; right: -3px; }

    .edge-scale-x {
      position: absolute;
      left: 70px;
      right: 70px;
      height: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 9px;
      color: rgba(255, 235, 0, 0.7);
      letter-spacing: 2px;
    }
    .edge-scale-top { top: 18px; border-top: 1px dashed rgba(255, 235, 0, 0.3); }
    .edge-scale-bottom { bottom: 18px; border-bottom: 1px dashed rgba(255, 235, 0, 0.3); }

    .edge-scale-y {
      position: absolute;
      top: 70px;
      bottom: 70px;
      width: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      font-size: 8px;
      color: rgba(0, 240, 255, 0.5);
    }
    .edge-scale-left { left: 16px; border-left: 1px dashed rgba(0, 240, 255, 0.3); padding-left: 4px; }
    .edge-scale-right { right: 16px; border-right: 1px dashed rgba(255, 0, 119, 0.3); padding-right: 4px; text-align: right; }

    .edge-reticle {
      position: absolute;
      width: 14px;
      height: 14px;
      border: 1px solid rgba(0, 240, 255, 0.8);
      border-radius: 50%;
    }
    .edge-reticle::before {
      content: '';
      position: absolute;
      top: 50%; left: -4px; right: -4px; height: 1px;
      background: rgba(0, 240, 255, 0.8);
    }
    .edge-reticle::after {
      content: '';
      position: absolute;
      left: 50%; top: -4px; bottom: -4px; width: 1px;
      background: rgba(0, 240, 255, 0.8);
    }
    .reticle-left { top: 50%; left: 16px; transform: translateY(-50%); }
    .reticle-right { top: 50%; right: 16px; transform: translateY(-50%); border-color: #ff0077; }
    .reticle-right::before, .reticle-right::after { background: #ff0077; }

    .hud-title {
      position: absolute;
      top: 36px;
      left: 70px;
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #00f0ff;
      text-shadow: 0 0 8px rgba(0, 240, 255, 0.6);
    }
    .hud-title span { color: #ffeb00; }

    .hud-stats {
      position: absolute;
      bottom: 36px;
      right: 70px;
      font-size: 10px;
      letter-spacing: 1.5px;
      color: rgba(255, 255, 255, 0.6);
      text-align: right;
    }
    .hud-stats b { color: #ff0077; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="webgl-container"></div>

  <div class="screen-edges">
    <div class="corner corner-tl"></div>
    <div class="corner corner-tr"></div>
    <div class="corner corner-bl"></div>
    <div class="corner corner-br"></div>

    <div class="edge-scale-x edge-scale-top">
      <span>GRID: CMYK-ACTIVE</span>
      <span>CORRIDOR: 3D THREE-ENGINE</span>
      <span>RADAR: 360° ACTIVE SWEEP</span>
    </div>
    <div class="edge-scale-x edge-scale-bottom">
      <span>SYS.AZ: 312.4°</span>
      <span>SYS.EL: +18.2°</span>
      <span>FOV: PERSPECTIVE PARALLAX</span>
      <span>STATUS: SYNCHRONIZED</span>
    </div>

    <div class="edge-scale-y edge-scale-left">
      <span>+40</span><span>+20</span><span>00</span><span>-20</span><span>-40</span>
    </div>
    <div class="edge-scale-y edge-scale-right">
      <span>09</span><span>06</span><span>03</span><span>00</span>
    </div>

    <div class="edge-reticle reticle-left"></div>
    <div class="edge-reticle reticle-right"></div>

    <div class="hud-title">CRYSTAL_<span>TIME</span> // RADAR-CORE</div>
    <div class="hud-stats">
      FPS: <span id="fps">60</span> | PARALLAX: <b>DERIVED</b><br>
      CURSOR TRACK: <span id="cursor-pos">0.00, 0.00</span>
    </div>
  </div>

  <script>
    // --- 1. Scene, Camera, Renderer ---
    const container = document.getElementById('webgl-container');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x03070d, 0.025);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    const baseCamPos = new THREE.Vector3(4.5, 3.2, 5.0);
    camera.position.copy(baseCamPos);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x03070d, 1.0);
    container.appendChild(renderer.domElement);

    // --- 2. Background Tactical Grids & Flourishes ---
    const bgGroup = new THREE.Group();
    scene.add(bgGroup);

    // Far background tactical floor grid
    const floorGrid = new THREE.GridHelper(40, 40, 0x00f0ff, 0x082030);
    floorGrid.position.set(0, -3.5, 0);
    bgGroup.add(floorGrid);

    // Background floating radar ring (Cyan)
    const ringGeo1 = new THREE.RingGeometry(2.4, 2.45, 64);
    const ringMat1 = new THREE.MeshBasicMaterial({ color: 0x00f0ff, side: THREE.DoubleSide, transparent: true, opacity: 0.25 });
    const bgRing1 = new THREE.Mesh(ringGeo1, ringMat1);
    bgRing1.position.set(-3.0, 1.0, -6.0);
    bgGroup.add(bgRing1);

    // Background floating radar ring (Magenta)
    const ringGeo2 = new THREE.RingGeometry(3.2, 3.25, 64);
    const ringMat2 = new THREE.MeshBasicMaterial({ color: 0xff0077, side: THREE.DoubleSide, transparent: true, opacity: 0.2 });
    const bgRing2 = new THREE.Mesh(ringGeo2, ringMat2);
    bgRing2.position.set(3.5, -0.5, -7.0);
    bgGroup.add(bgRing2);

    // --- 3. The Crystallized Time Monolith ---
    const corridorGroup = new THREE.Group();
    scene.add(corridorGroup);

    // Diagonal isometric alignment matching the reference
    corridorGroup.rotation.y = -Math.PI / 4;
    corridorGroup.rotation.x = 0.15;
    corridorGroup.rotation.z = -0.1;

    const boxW = 1.6, boxH = 1.1, boxL = 12.0;

    // A. Outer Glass Sheath (Double-pass: glowing colored wireframe + transmissive shell)
    const boxGeo = new THREE.BoxGeometry(boxW, boxH, boxL);
    const boxMat = new THREE.MeshPhysicalMaterial({
      color: 0x051525,
      transparent: true,
      opacity: 0.35,
      roughness: 0.1,
      metalness: 0.1,
      transmission: 0.6,
      ior: 1.4,
      side: THREE.DoubleSide,
      depthWrite: false
    });
    const glassBox = new THREE.Mesh(boxGeo, boxMat);
    corridorGroup.add(glassBox);

    // Chamfer/Edge Highlights (Cyan Wireframe edges)
    const edgeGeo = new THREE.EdgesGeometry(boxGeo);
    const edgeMat = new THREE.LineBasicMaterial({ color: 0x00f0ff, linewidth: 2, transparent: true, opacity: 0.85 });
    const edgeLines = new THREE.LineSegments(edgeGeo, edgeMat);
    corridorGroup.add(edgeLines);

    // Front Cap Frame Accent (Yellow)
    const capGeo = new THREE.PlaneGeometry(boxW, boxH);
    const capEdges = new THREE.EdgesGeometry(capGeo);
    const capMat = new THREE.LineBasicMaterial({ color: 0xffeb00, linewidth: 3 });
    const frontCap = new THREE.LineSegments(capEdges, capMat);
    frontCap.position.z = boxL / 2;
    corridorGroup.add(frontCap);

    // B. Internal Procedural Topographic Terrain (Magenta wireframe)
    const topoSegmentsX = 24;
    const topoSegmentsZ = 120;
    const topoGeo = new THREE.PlaneGeometry(boxW * 0.95, boxL * 0.98, topoSegmentsX, topoSegmentsZ);
    topoGeo.rotateX(-Math.PI / 2);
    topoGeo.translate(0, -boxH * 0.48, 0);

    const pos = topoGeo.attributes.position;
    const originalY = new Float32Array(pos.count);
    for (let i = 0; i < pos.count; i++) {
      const vx = pos.getX(i);
      const vz = pos.getZ(i);
      const h = (Math.sin(vx * 5.0) * Math.cos(vz * 1.5) + Math.sin(vz * 3.0 + vx * 2.0) * 0.5) * 0.18 + 0.12;
      pos.setY(i, pos.getY(i) + h);
      originalY[i] = pos.getY(i);
    }
    topoGeo.computeVertexNormals();

    const topoMat = new THREE.MeshBasicMaterial({
      color: 0xff0077,
      wireframe: true,
      transparent: true,
      opacity: 0.65
    });
    const topoMesh = new THREE.Mesh(topoGeo, topoMat);
    corridorGroup.add(topoMesh);

    // C. Internal Radar Sweep Discs (Horizontal & Floating)
    function createRadarDisc(radius, ringCount, colorHex) {
      const discGroup = new THREE.Group();
      discGroup.rotation.x = Math.PI / 2;

      for (let r = 1; r <= ringCount; r++) {
        const ringG = new THREE.RingGeometry((radius / ringCount) * r - 0.008, (radius / ringCount) * r, 32);
        const ringM = new THREE.MeshBasicMaterial({ color: colorHex, side: THREE.DoubleSide, transparent: true, opacity: 0.6 });
        discGroup.add(new THREE.Mesh(ringG, ringM));
      }

      // Crosshairs
      const lineMat = new THREE.LineBasicMaterial({ color: colorHex, transparent: true, opacity: 0.4 });
      const lineG1 = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(-radius, 0, 0), new THREE.Vector3(radius, 0, 0)]);
      const lineG2 = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, -radius, 0), new THREE.Vector3(0, radius, 0)]);
      discGroup.add(new THREE.Line(lineG1, lineMat));
      discGroup.add(new THREE.Line(lineG2, lineMat));

      // Sector Sweep Needle
      const sweepG = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, 0, 0.005), new THREE.Vector3(radius, 0, 0.005)]);
      const sweepMat = new THREE.LineBasicMaterial({ color: 0xffeb00, linewidth: 2 });
      const sweepNeedle = new THREE.Line(sweepG, sweepMat);
      discGroup.add(sweepNeedle);

      discGroup.userData.needle = sweepNeedle;
      return discGroup;
    }

    // Near Front Radar (Cyan)
    const radarFront = createRadarDisc(0.42, 3, 0x00f0ff);
    radarFront.position.set(0.1, 0.05, 3.5);
    corridorGroup.add(radarFront);

    // Mid Radar (Yellow)
    const radarMid = createRadarDisc(0.35, 2, 0xffeb00);
    radarMid.position.set(-0.2, 0.1, -0.5);
    corridorGroup.add(radarMid);

    // Deep Radar (Magenta)
    const radarBack = createRadarDisc(0.38, 3, 0xff0077);
    radarBack.position.set(0.15, -0.05, -3.8);
    corridorGroup.add(radarBack);

    // D. Suspended Spheres & Beacons
    // 1. Front Magenta Planet / Dome Sphere
    const orbGeo1 = new THREE.SphereGeometry(0.24, 16, 12);
    const orbMat1 = new THREE.MeshBasicMaterial({ color: 0xff0077, wireframe: true, transparent: true, opacity: 0.8 });
    const orb1 = new THREE.Mesh(orbGeo1, orbMat1);
    orb1.position.set(-0.35, -0.05, 4.2);
    corridorGroup.add(orb1);

    // 2. High-intensity Yellow Energy Beacon with Aura
    const orbGeo2 = new THREE.SphereGeometry(0.14, 16, 16);
    const orbMat2 = new THREE.MeshBasicMaterial({ color: 0xffeb00 });
    const orb2 = new THREE.Mesh(orbGeo2, orbMat2);
    orb2.position.set(0.35, 0.15, 1.2);
    corridorGroup.add(orb2);

    const haloGeo = new THREE.SphereGeometry(0.26, 16, 16);
    const haloMat = new THREE.MeshBasicMaterial({ color: 0xffeb00, transparent: true, opacity: 0.25, wireframe: true });
    const halo = new THREE.Mesh(haloGeo, haloMat);
    orb2.add(halo);

    // 3. Cyan Targeting Orb
    const orbGeo3 = new THREE.SphereGeometry(0.18, 12, 10);
    const orbMat3 = new THREE.MeshBasicMaterial({ color: 0x00f0ff, wireframe: true, transparent: true, opacity: 0.7 });
    const orb3 = new THREE.Mesh(orbGeo3, orbMat3);
    orb3.position.set(-0.25, 0.18, -2.0);
    corridorGroup.add(orb3);

    // E. Long Yellow Telemetry Conduit Baseline
    const linePts = [];
    for (let z = -boxL / 2 + 0.2; z <= boxL / 2 - 0.2; z += 0.2) {
      linePts.push(new THREE.Vector3(0.5, 0.35, z));
    }
    const conduitGeo = new THREE.BufferGeometry().setFromPoints(linePts);
    const conduitMat = new THREE.LineDashedMaterial({
      color: 0xffeb00,
      dashSize: 0.15,
      gapSize: 0.1,
      linewidth: 2
    });
    const conduitLine = new THREE.Line(conduitGeo, conduitMat);
    conduitLine.computeLineDistances();
    corridorGroup.add(conduitLine);

    // --- 4. Smooth Mouse-Position Parallax ---
    let targetMouseX = 0, targetMouseY = 0;
    let smoothMouseX = 0, smoothMouseY = 0;

    window.addEventListener('mousemove', (e) => {
      targetMouseX = (e.clientX / window.innerWidth - 0.5) * 2;
      targetMouseY = (e.clientY / window.innerHeight - 0.5) * 2;
      document.getElementById('cursor-pos').innerText = 
        `${targetMouseX.toFixed(2)}, ${(-targetMouseY).toFixed(2)}`;
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // --- 5. Animation Loop ---
    let lastTime = 0;
    let frameCount = 0;
    let fpsTimer = 0;
    const fpsElem = document.getElementById('fps');

    function animate(now) {
      requestAnimationFrame(animate);
      now *= 0.001;
      const delta = now - lastTime;
      lastTime = now;

      // FPS Counter
      frameCount++;
      fpsTimer += delta;
      if (fpsTimer >= 0.5) {
        fpsElem.innerText = Math.round(frameCount / fpsTimer);
        frameCount = 0;
        fpsTimer = 0;
      }

      // Smooth Parallax Camera Shifts
      smoothMouseX += (targetMouseX - smoothMouseX) * 0.05;
      smoothMouseY += (targetMouseY - smoothMouseY) * 0.05;

      camera.position.x = baseCamPos.x + smoothMouseX * 1.2;
      camera.position.y = baseCamPos.y - smoothMouseY * 0.8;
      camera.lookAt(-0.2, 0.0, 0.0);

      // Rotate Tactical Radar Sweeps
      if (radarFront.userData.needle) radarFront.userData.needle.rotation.z -= delta * 3.5;
      if (radarMid.userData.needle) radarMid.userData.needle.rotation.z += delta * 2.2;
      if (radarBack.userData.needle) radarBack.userData.needle.rotation.z -= delta * 2.8;

      // Animate background radar rings
      bgRing1.rotation.z += delta * 0.15;
      bgRing2.rotation.z -= delta * 0.1;

      // Pulse Yellow Beacon Aura
      const pulse = 1.0 + Math.sin(now * 5.0) * 0.15;
      halo.scale.set(pulse, pulse, pulse);

      // Rotate Sensor Orbs
      orb1.rotation.y += delta * 0.4;
      orb3.rotation.x += delta * 0.5;

      // Scroll Wireframe Topography along Z to simulate time crystallization flow
      const positions = topoGeo.attributes.position;
      for (let i = 0; i < positions.count; i++) {
        const vx = positions.getX(i);
        const vz = positions.getZ(i);
        const wave = Math.sin(vx * 6.0 + now * 2.5) * Math.cos(vz * 2.0 - now * 1.8) * 0.08;
        positions.setY(i, originalY[i] + wave);
      }
      positions.needsUpdate = true;

      renderer.render(scene, camera);
    }

    animate(0);
  </script>
</body>
</html>
